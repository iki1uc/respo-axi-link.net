<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO‑AXI‑LINK.NET</title>

<script type="module">
import { axiLink } from "./axi-link.js";

async function buildButtons() {
    const lage = await fetch("axi-lage.json").then(r => r.json());
    const container = document.getElementById("axis-buttons");

    Object.keys(lage).forEach(axis => {
        const btn = document.createElement("button");
        btn.innerText = axis;
        btn.onclick = async () => {
            const info = await axiLink(axis);
            window.location.href = info.route + "?axis=" + axis;
        };
        container.appendChild(btn);
    });
}

window.addEventListener("DOMContentLoaded", buildButtons);
</script>

</head>
<body>

<h1>RESPO‑AXI‑LINK.NET</h1>
<p>Dynamischer Achsen‑Dispatcher</p>

<div id="axis-buttons"></div>

</body>
</html>
