<!DOCTYPE html>
<html>
<head>
    <title>RESPO AXI-Link</title>
    <script src="axi-link.js"></script>
    <script src="router-hook.js"></script>
</head>

<body>
    <h1>RESPO AXI-Link</h1>
    <p>Verbindet RESPO-Systeme mit AXI‑fähigen Modulen.</p>

    <h2>Aktionen</h2>
    <button onclick="AXI.init()">AXI initialisieren</button>
    <button onclick="AXI.check()">AXI prüfen</button>
    <button onclick="AXI.write(0x1000, 42)">AXI Write</button>
    <button onclick="AXI.read(0x1000)">AXI Read</button>

    <h2>Router</h2>
    <button onclick="RouterHook.send('axi-ready')">Router informieren</button>
</body>
</html>
