<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AXI‑ID · Dynamisch</title>

<script type="module">
async function buildTable() {
    const lage = await fetch("axi-lage.json").then(r => r.json());
    const table = document.getElementById("axi-table");

    Object.keys(lage).forEach(axis => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${axis}</td>
            <td>${lage[axis].slot}</td>
            <td>${lage[axis].group}</td>
            <td>${lage[axis].depth}</td>
        `;
        table.appendChild(row);
    });
}

window.addEventListener("DOMContentLoaded", buildTable);
</script>

</head>
<body>

<h1>AXI‑ID · Dynamische Achsenliste</h1>

<table border="1">
<thead>
<tr><th>Achse</th><th>Slot</th><th>Gruppe</th><th>Depth</th></tr>
</thead>
<tbody id="axi-table"></tbody>
</table>

</body>
</html>
